x-default: &node
  # Corresponds to the user set in the Dockerfile and the shiny-server
  # user on the server for proper write perms to mounted directories
  user: "${UID:-1003}:0"
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./drivers:/jdbc:ro
    - ./src:/tmp/src:ro
    - ./config:/tmp/config:ro
    - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./target:/tmp/target:rw
    - ./logs:/tmp/logs:rw
  secrets:
    - AWS_CREDENTIALS
    - IPTS_PRD_PASSWORD
    - IPTS_TST_PASSWORD
    - IPTS_CONNECTION
    - SPARK_ENV
  networks:
    - sparknet

# Commands to start each node type (master and worker).
#
# We want to start Spark using the standalone mode, documented here:
# https://spark.apache.org/docs/3.5.9/spark-standalone.html
# However, we don't want to use the recommended `start-*.sh` scripts because
# those scripts start Spark as a daemon process and so are not a good fit for
# containerized services. Instead, we use the `spark-class` command to start
# the Spark processes directly, which is what the `start-*.sh` scripts do under
# the hood.
#
# See this StackOverflow answer for documentation of this approach:
# https://stackoverflow.com/a/39671404
#
# We use exec form (a list of arguments) so that Spark runs as PID 1 and
# receives signals like SIGTERM from `docker stop` directly.
x-master-command: &master-command
  ["spark-class", "org.apache.spark.deploy.master.Master"]

# Pass the worker command to Docker wrapped in a `bash -c exec` call. This is
# important because the worker needs to expand the `SPARK_MASTER_URL` env var at
# runtime, but Docker can't expand variables at runtime when a command is
# specified using exec form. To work around this limitation, we run the command
# in a shell (`bash -c`) to expand the env var, and then we replace the shell
# with the command using `exec` so that it runs as PID 1 and receives SIGTERM.
# See these docs for more info about variable substitution in exec form:
# https://docs.docker.com/reference/dockerfile/#variable-substitution
#
# We use an extra dollar sign when referencing the `SPARK_MASTER_URL` env var
# in order to prevent the Compose file from interpolating the variable from the
# host environment at parse time. See:
# https://docs.docker.com/reference/compose-file/interpolation/
x-worker-command: &worker-command
  ["bash", "-c",
   "exec spark-class org.apache.spark.deploy.worker.Worker \"$$SPARK_MASTER_URL\""]

# These environmental variables get merged into the env vars of containers.
# See: https://docs.docker.com/reference/compose-file/extension/#example-4
x-spark-env: &spark-env
  SPARK_PUBLIC_DNS: 10.129.122.29

  AWS_SHARED_CREDENTIALS_FILE: /run/secrets/AWS_CREDENTIALS
  IPTS_CONNECTION_FILE: /run/secrets/IPTS_CONNECTION
  SPARK_ENV_FILE: /run/secrets/SPARK_ENV

services:
  spark-node-master-dev:
    <<: *node
    profiles: ["", "dev"]
    image: ghcr.io/ccao-data/service-spark-iasworld:dev
    container_name: spark-node-master-dev
    hostname: spark-node-master-dev
    restart: no
    command: *master-command
    environment:
      <<: *spark-env
      SPARK_MASTER_URL: spark://spark-node-master-dev:7077
      SPARK_UI_PORT: 4041
      SPARK_EXECUTOR_MEMORY: 32g
      SPARK_MASTER_WEBUI_PORT: 8082
      CLOUDWATCH_LOG_GROUP_NAME: /ccao/jobs/spark-dev
    ports:
      - 4041:4041
      - 8082:8082

  spark-node-worker-dev:
    <<: *node
    profiles: ["", "dev"]
    image: ghcr.io/ccao-data/service-spark-iasworld:dev
    container_name: spark-node-worker-dev
    restart: no
    command: *worker-command
    environment:
      <<: *spark-env
      SPARK_MASTER_URL: spark://spark-node-master-dev:7077
      SPARK_WORKER_MEMORY: 32g
      SPARK_WORKER_CORES: 16
      SPARK_WORKER_WEBUI_PORT: 9091
    ports:
      - 9091:9091

  spark-node-master-prod:
    <<: *node
    profiles: [prod]
    image: ghcr.io/ccao-data/service-spark-iasworld:latest
    container_name: spark-node-master-prod
    hostname: spark-node-master-prod
    restart: unless-stopped
    command: *master-command
    environment:
      <<: *spark-env
      SPARK_MASTER_URL: spark://spark-node-master-prod:7077
      SPARK_UI_PORT: 4040
      SPARK_EXECUTOR_MEMORY: 82g
      SPARK_MASTER_WEBUI_PORT: 8080
      CLOUDWATCH_LOG_GROUP_NAME: /ccao/jobs/spark
    ports:
      - 4040:4040
      - 8080:8080

  spark-node-worker-prod:
    <<: *node
    profiles: [prod]
    image: ghcr.io/ccao-data/service-spark-iasworld:latest
    container_name: spark-node-worker-prod
    restart: unless-stopped
    command: *worker-command
    environment:
      <<: *spark-env
      SPARK_MASTER_URL: spark://spark-node-master-prod:7077
      SPARK_WORKER_MEMORY: 82G
      SPARK_WORKER_CORES: 24
      SPARK_WORKER_WEBUI_PORT: 9090
    ports:
      - 9090:9090

# Using a dedicated subnet because the Docker default subnet conflicts
# with some of the CCAO's internal routing
networks:
  sparknet:
    ipam:
      config:
        - subnet: 211.55.0.0/16
    name: sparknet

secrets:
  AWS_CREDENTIALS:
    file: secrets/AWS_CREDENTIALS_FILE
  IPTS_CONNECTION:
    file: secrets/IPTS_CONNECTION
  IPTS_PRD_PASSWORD:
    file: secrets/IPTS_PRD_PASSWORD
  IPTS_TST_PASSWORD:
    file: secrets/IPTS_TST_PASSWORD
  SPARK_ENV:
    file: secrets/SPARK_ENV
